<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SPACE membership registration portal — request an invitation or complete your registration.">
  <title>SPACE — Membership Registration</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Graduate&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <meta name="theme-color" content="#000000">
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    (function () {
      var theme = 'dark';
      try { if (localStorage.getItem('mis.theme') === 'light') theme = 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <main class="hero">
    <div class="hero__top">
      <div class="presenter">
        <img src="assets/whytehoux.png" alt="Whytehoux" width="168" height="66">
        <p>Presents</p>
      </div>
      <div class="beacon" data-beacon data-state="checking">
        <span class="beacon__dot" aria-hidden="true"></span>
        <span data-beacon-label>Checking…</span>
      </div>
    </div>

    <div class="hero__body">
      <h1 class="sr-only">SPACE</h1>
      <div class="hero__emblem" role="img" aria-label="SPACE emblem">
        <img class="emblem__body" src="assets/space-emblem-body.svg" alt="" width="400" height="405">
        <img class="emblem__eyes" src="assets/space-emblem-eyes.svg" alt="" width="400" height="405">
      </div>
      <div class="hero__cta">
        <a class="btn btn--light" href="interest.html">
          Request an invitation
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </a>
        <a class="btn btn--outline-light" href="invitation.html">I have an invitation code</a>
      </div>
    </div>

    <button class="theme-toggle" type="button" id="theme-toggle">
      <svg data-icon="sun" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
      <svg data-icon="moon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      <span data-theme-label>Light</span>
    </button>
  </main>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/api.js"></script>
  <script>
    MIS.startStatus();

    // Light / dark toggle. The choice is remembered on this device.
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var label = btn.querySelector('[data-theme-label]');
      var meta = document.querySelector('meta[name="theme-color"]');
      function render() {
        var light = root.getAttribute('data-theme') === 'light';
        label.textContent = light ? 'Dark' : 'Light';
        btn.setAttribute('aria-label', 'Switch to ' + (light ? 'dark' : 'light') + ' mode');
        meta.setAttribute('content', light ? '#ffffff' : '#000000');
      }
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('mis.theme', next); } catch (e) {}
        render();
      });
      render();
    })();
  </script>
</body>
</html>
